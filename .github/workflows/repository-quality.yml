name: Repository Quality
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          if grep -RIn --exclude-dir=.git --exclude='*.md' --exclude='*.txt' --exclude='*.lock' -E '^(<<<<<<<|=======|>>>>>>>)( |$)' .; then exit 1; fi
      - name: Build .NET
        shell: bash
        run: |
          mapfile -t projects < <(find . -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*')
          for project in "${projects[@]}"; do dotnet build "$project" -c Release; done
      - name: Build frontend
        shell: bash
        run: |
          if [ -f package.json ]; then npm ci && npm run build --if-present && npm test --if-present -- --watch=false; fi
